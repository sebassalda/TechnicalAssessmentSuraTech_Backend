name: CI - Java and Terraform
on:
  pull_request:
  push:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  java-tests:
    name: Java 21 tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: practical
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: practical/pom.xml
      - name: Run unit tests and package
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: practical/target/surefire-reports/
          if-no-files-found: warn
  terraform-check:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'
      - name: Check formatting
        run: terraform -chdir=infra fmt -check -recursive
      - name: Initialize without remote backend
        run: terraform -chdir=infra init -backend=false -input=false
      - name: Validate configuration
        run: terraform -chdir=infra validate -no-color
  security-check:
    name: Repository security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
